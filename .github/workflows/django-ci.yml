name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wpg_ci
          POSTGRES_USER: wpg_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wpg_ci -d wpg_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
      DJANGO_TIME_ZONE: Africa/Kigali
      DJANGO_LOG_LEVEL: WARNING
      DJANGO_LOG_FORMAT: verbose
      POSTGRES_DB: wpg_ci
      POSTGRES_USER: wpg_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Django validation
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput

      - name: Run test suite
        run: python manage.py test -v 1

      - name: Security preflight
        run: python scripts/security_preflight.py

      - name: Production deployment checks
        env:
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: example.test
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.test
          DJANGO_LOG_FORMAT: json
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          DJANGO_SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy
