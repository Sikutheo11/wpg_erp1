upstream wpg_bos {
    server unix:/run/wpg-bos/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;

    server_name wisdompalacegroup.com www.wisdompalacegroup.com;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/wpg-bos/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Public customer and catalogue images.
    location ^~ /media/products/ {
        alias /var/www/wpg-bos/media/products/;
        expires 7d;
    }

    location ^~ /media/ecommerce/products/ {
        alias /var/www/wpg-bos/media/ecommerce/products/;
        expires 7d;
    }

    location ^~ /media/users/profile_pictures/ {
        alias /var/www/wpg-bos/media/users/profile_pictures/;
        expires 7d;
    }

    location ^~ /media/users/cover_photos/ {
        alias /var/www/wpg-bos/media/users/cover_photos/;
        expires 7d;
    }

    # Payment proofs and internal production/quality evidence
    # must never be served directly by Nginx.
    location ^~ /media/ecommerce/payment_proofs/ {
        return 404;
    }

    location ^~ /media/production_outputs/ {
        return 404;
    }

    location ^~ /media/production_task_progress/ {
        return 404;
    }

    location ^~ /media/quality/ {
        return 404;
    }

    # Deny every media path not explicitly allowed above.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://wpg_bos;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}