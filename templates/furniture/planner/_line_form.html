<form method="post" action="{{ action }}" class="row g-2 align-items-end">
{% csrf_token %}
{% for field in line_form %}
<div class="col-md-3"><label class="form-label small">{{ field.label }}</label>{{ field }}</div>
{% endfor %}
<div class="col-md-2"><button class="btn btn-outline-primary w-100" type="submit">Add</button></div>
</form>
