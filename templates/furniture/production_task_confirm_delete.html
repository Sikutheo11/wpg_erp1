{% extends "base_dashboard.html" %}
{% block title %}Cancel Task{% endblock %}
{% block page_title %}Cancel Production Task{% endblock %}
{% block content %}
<div class="container-fluid"><div class="row justify-content-center"><div class="col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body p-4 text-center">
<i class="bi bi-exclamation-triangle text-danger display-4"></i><h4 class="mt-3">Cancel this task?</h4><p class="text-muted">{{ task.name }} — {{ task.production_job }}</p>
<form method="post">{% csrf_token %}<textarea name="reason" class="form-control mb-3" rows="3" placeholder="Reason"></textarea><a href="{% url 'furniture:production_task_detail' task.pk %}" class="btn btn-outline-secondary">Back</a> <button class="btn btn-danger">Cancel Task</button></form>
</div></div></div></div></div>
{% endblock %}
