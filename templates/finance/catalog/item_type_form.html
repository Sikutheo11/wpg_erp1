{% extends "base_dashboard.html" %}
{% block title %}Add item{% endblock %}
{% block page_title %}Add item{% endblock %}
{% block content %}<div class="container"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h3>Add item</h3><p class="text-muted">Create an item type inside an item group.</p><form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ kind }}">{{ form.as_p }}<div class="d-flex gap-2"><button class="btn btn-primary">Save</button><a class="btn btn-outline-secondary" href="{% if kind == 'payable' %}{% url 'finance:payable_create' %}{% else %}{% url 'finance:receivable_create' %}{% endif %}">Cancel</a></div></form></div></div></div>{% endblock %}
