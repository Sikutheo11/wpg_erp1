{% extends "ecommerce/base_ecommerce.html" %}

{% block content %}

<div class="container py-5 text-center">

    <div class="card shadow p-5">

        <h2 class="text-success">🎉 Order Placed Successfully</h2>

        <p class="mt-3">
            Thank you <strong>{{ order.customer_name }}</strong>
        </p>

        <h4>
            Order ID: #{{ order.id }}
        </h4>

        <p class="text-muted">
            We will contact you soon on {{ order.customer_phone }}
        </p>

        <a href="{% url 'ecommerce:shop' %}"
           class="btn btn-primary mt-3">

            Continue Shopping

        </a>

    </div>

</div>

{% endblock %}
